name: CI

on:
  push:
    branches: ["main", "fix/**"]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install Qt system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 \
            libxcb-shape0 libxcb-xinerama0 libfontconfig1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install xlwt

      - name: Lint
        run: ruff check --no-cache src tests

      - name: Type check
        # numpy>=2.4 的 stubs 使用了 3.12+ 语法; 类型检查固定在 3.12, 运行测试仍覆盖 3.11/3.12
        run: mypy --no-incremental --ignore-missing-imports --python-version 3.12 src/fsa

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q -m "not slow"

  package-windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install pyinstaller

      - name: Build general edition
        shell: powershell
        run: .\scripts\build_installer.ps1 -Edition general

      - name: Upload portable build
        uses: actions/upload-artifact@v4
        with:
          name: fsa-general-windows
          path: dist/fsa
          retention-days: 7

  coverage:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install xlwt

      - name: Core coverage gate (engine/services/storage >= 90%)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          pytest -q -m "not slow"             --cov=fsa.core --cov=fsa.services --cov=fsa.storage             --cov-report=term-missing --cov-fail-under=90

      - name: Overall coverage baseline (>= 84%, 逐步提升至 90%)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          pytest -q -m "not slow"             --cov=fsa --cov-report=term-missing --cov-fail-under=84
